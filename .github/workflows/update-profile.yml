name: Update Profile Visuals

on:
  # Run automatically every day at 00:00 UTC
  schedule:
    - cron: '0 0 * * *'
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      force:
        description: 'Force overwrite of generated assets'
        required: false
        type: boolean
        default: false

# Minimum required workflow permissions to commit generated SVGs back to repository
permissions:
  contents: write

# Prevent concurrent runs from clashing
concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Visual Assets & Update README
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Profile Generator Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python -m scripts.generate_all

      - name: Check for Generated Asset Changes
        id: git_check
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & Push Idempotent Changes
        if: steps.git_check.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add generated/ README.md
          git commit -m "chore(profile): refresh telemetry & visual assets [skip ci]"
          git push
